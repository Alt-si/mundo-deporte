name: Actualizar partidos

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Descargar partidos y tablas (ESPN)
        run: node tools/fetch-espn.mjs
      - name: Publicar cambios
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/fixtures.json data/status.json
          git diff --cached --quiet || (git commit -m "Actualizar partidos" && git pull --rebase -q && git push)
